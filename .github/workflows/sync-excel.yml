name: Sync Excel từ OneDrive

on:
  schedule:
    - cron: '*/15 * * * *'   # chạy tự động mỗi 15 phút
  workflow_dispatch: {}       # cho phép bấm nút "Run workflow" để cập nhật ngay lập tức

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cài trình duyệt ảo (Playwright)
        run: |
          npm init -y --silent
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Tải file Excel bằng trình duyệt ảo
        env:
          EXCEL_URL: ${{ secrets.EXCEL_DOWNLOAD_URL }}
        run: |
          node -e "
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            const downloadPromise = page.waitForEvent('download', { timeout: 60000 });
            await page.goto(process.env.EXCEL_URL, { waitUntil: 'load', timeout: 60000 }).catch(() => {});
            const download = await downloadPromise;
            await download.saveAs('data.xlsx.new');
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          "

      - name: So sánh và commit nếu có thay đổi
        run: |
          if [ ! -s data.xlsx.new ]; then
            echo "File tải về rỗng, huỷ."
            exit 1
          fi
          if [ ! -f data.xlsx ] || ! cmp -s data.xlsx.new data.xlsx; then
            mv data.xlsx.new data.xlsx
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data.xlsx
            git commit -m "Đồng bộ dữ liệu Excel từ OneDrive"
            git push
          else
            echo "Không có thay đổi, bỏ qua."
            rm -f data.xlsx.new
          fi
